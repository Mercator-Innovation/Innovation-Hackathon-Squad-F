<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 17 12" width="68" height="48" shape-rendering="crispEdges">
  <!-- A tiny pixel Turtle Toast turtle with his toast, for swimming around the home page -->
  <!-- tail -->
  <rect x="1" y="6" width="2" height="1" fill="#5fd35a"/>
  <!-- shell outline and dome -->
  <rect x="5" y="0" width="4" height="1" fill="#1d3b1f"/>
  <rect x="4" y="1" width="6" height="1" fill="#1d3b1f"/>
  <rect x="3" y="2" width="8" height="5" fill="#1d3b1f"/>
  <rect x="5" y="1" width="4" height="1" fill="#5fd35a"/>
  <rect x="4" y="2" width="6" height="4" fill="#5fd35a"/>
  <!-- shell pattern -->
  <rect x="5" y="2" width="1" height="1" fill="#9df58c"/>
  <rect x="7" y="2" width="1" height="1" fill="#9df58c"/>
  <rect x="4" y="3" width="1" height="1" fill="#9df58c"/>
  <rect x="6" y="3" width="1" height="1" fill="#9df58c"/>
  <rect x="8" y="3" width="1" height="1" fill="#9df58c"/>
  <rect x="5" y="4" width="1" height="1" fill="#9df58c"/>
  <rect x="7" y="4" width="1" height="1" fill="#9df58c"/>
  <rect x="9" y="4" width="1" height="1" fill="#9df58c"/>
  <rect x="4" y="5" width="6" height="1" fill="#3fa13c"/>
  <!-- belt -->
  <rect x="2" y="7" width="10" height="1" fill="#f6d04d"/>
  <!-- legs -->
  <rect x="3" y="8" width="2" height="2" fill="#5fd35a"/>
  <rect x="9" y="8" width="2" height="2" fill="#5fd35a"/>
  <rect x="3" y="10" width="2" height="1" fill="#1d3b1f"/>
  <rect x="9" y="10" width="2" height="1" fill="#1d3b1f"/>
  <!-- head -->
  <rect x="11" y="3" width="3" height="4" fill="#5fd35a"/>
  <rect x="12" y="4" width="1" height="1" fill="#ffffff"/>
  <rect x="13" y="4" width="1" height="1" fill="#1d3b1f"/>
  <rect x="12" y="6" width="1" height="1" fill="#ff8fb1"/>
  <!-- toast -->
  <rect x="14" y="2" width="3" height="5" fill="#a0602a"/>
  <rect x="14" y="3" width="2" height="3" fill="#f2c46b"/>
</svg>
