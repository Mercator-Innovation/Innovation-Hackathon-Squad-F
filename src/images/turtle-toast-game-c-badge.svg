<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" role="img"><title>Turtle Toast, esports badge: a turtle mascot eating toast on a shield</title>
<defs><linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A00"/><stop offset="1" stop-color="#FF2E88"/></linearGradient></defs>
<path d="M150 10 L274 50 L262 190 Q244 262 150 304 Q56 262 38 190 L26 50 Z" fill="url(#sh)" stroke="#111111" stroke-width="10" stroke-linejoin="round"/>
<path d="M150 28 L256 62 L246 186 Q230 248 150 284 Q70 248 54 186 L44 62 Z" fill="none" stroke="#FFE14D" stroke-width="4" stroke-linejoin="round"/>
<g fill="#FFFFFF" opacity="0.18"><path d="M60 60 L110 60 L60 160 Z"/><path d="M240 60 L240 120 L200 60 Z"/></g>
<g transform="translate(36 30) scale(0.98)">
  <ellipse cx="62" cy="158" rx="16" ry="12" fill="#A6FF4D" stroke="#111111" stroke-width="6"/>
  <ellipse cx="128" cy="160" rx="16" ry="12" fill="#A6FF4D" stroke="#111111" stroke-width="6"/>

  <!-- Little tail -->
  <path d="M38 138 Q22 140 26 150 Q34 146 44 146 Z" fill="#A6FF4D" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>

  <!-- Shell -->
  <path d="M36 145 Q40 70 98 66 Q154 70 160 145 Z" fill="#12D464" stroke="#111111" stroke-width="7.5" stroke-linejoin="round"/>
  <!-- Shell pattern -->
  <path d="M98 82 L116 94 L112 116 L84 116 L80 94 Z" fill="#6BFFA0" stroke="#111111" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M56 120 L80 116 L84 116 L76 140 L50 140 Z" fill="#6BFFA0" stroke="#111111" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M112 116 L140 120 L146 140 L120 140 Z" fill="#6BFFA0" stroke="#111111" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Shell rim -->
  <rect x="30" y="140" width="136" height="12" rx="6" fill="#FFE14D" stroke="#111111" stroke-width="6"/>
  <!-- Shell shine -->
  <path d="M60 96 Q70 80 88 76" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Neck and head -->
  <path d="M150 128 Q160 112 170 104" fill="none" stroke="#111111" stroke-width="33" stroke-linecap="round"/>
  <path d="M150 128 Q160 112 170 104" fill="none" stroke="#A6FF4D" stroke-width="21" stroke-linecap="round"/>
  <circle cx="178" cy="92" r="26" fill="#A6FF4D" stroke="#111111" stroke-width="7.5"/>
  <!-- Eye -->
  <circle cx="184" cy="84" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <circle cx="186" cy="84" r="3.5" fill="#1E2B22"/>
  <circle cx="187.5" cy="82.5" r="1.2" fill="#FFFFFF"/>
  <!-- Cheek -->
  <circle cx="172" cy="100" r="5" fill="#F59BA8" opacity="0.8"/>
  <!-- Happy munching mouth -->
  <path d="M188 100 Q196 106 202 98" fill="none" stroke="#111111" stroke-width="5.25" stroke-linecap="round"/>

  <!-- Toast (with a bite out of it) -->
  <g transform="rotate(-14 208 118)">
    <path d="M196 96
             Q192 84 204 82 Q214 76 224 82 Q236 84 232 96
             L232 140 Q232 146 226 146 L202 146 Q196 146 196 140 Z"
          fill="#C9853A" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>
    <path d="M202 98 Q200 90 208 89 Q214 85 220 89 Q227 90 226 98 L226 136 Q226 140 222 140 L206 140 Q202 140 202 136 Z"
          fill="#F4D58D"/>
    <!-- Bite -->
    <circle cx="198" cy="104" r="7" fill="#FF5A3C"/>
    <circle cx="197" cy="116" r="6" fill="#FF5A3C"/>
    <!-- Butter -->
    <rect x="208" y="104" width="12" height="9" rx="2" fill="#FFE97A" stroke="#E0B832" stroke-width="3"/>
    <!-- Crumbs -->
  </g>
  <circle cx="196" cy="128" r="2.5" fill="#C9853A"/>
  <circle cx="204" cy="136" r="2" fill="#C9853A"/>

  <!-- Front feet holding the toast -->
  <ellipse cx="192" cy="122" rx="9" ry="7" fill="#A6FF4D" stroke="#111111" stroke-width="6"/>
  <ellipse cx="96" cy="160" rx="16" ry="12" fill="#A6FF4D" stroke="#111111" stroke-width="6"/>

  </g>
<path d="M4 206 L296 206 L282 254 L18 254 Z" fill="#111111"/>
<path d="M4 206 L-6 222 L8 238 L18 254 Z M296 206 L306 222 L292 238 L282 254 Z" fill="#111111"/>
<text x="150" y="242" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Impact, sans-serif" font-style="italic" font-weight="900" font-size="30" fill="#FFE14D" letter-spacing="1">TURTLE TOAST</text>
</svg>